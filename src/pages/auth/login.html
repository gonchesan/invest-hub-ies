<main
    class="min-h-screen flex items-center justify-center p-4 md:p-8 md:py-16 bg-[radial-gradient(circle_at_top_left,#f7f6fe_0%,#e0d7ff_100%)]">
    <div
        class="w-full max-w-6xl flex flex-col md:flex-row bg-surface-container-lowest rounded-xl overflow-hidden ambient-shadow min-h-175">
        <a href="/" class="flex gap-2 absolute top-6 text-primary font-bold ml-1">
            <span class="material-symbols-outlined" data-icon="arrow_left_alt">arrow_left_alt</span>
            Volver al inicio
        </a>
        <!-- Lado izquierdo -->
        <section
            class="hidden md:flex md:w-1/2 relative bg-linear-60 from-zinc-800 via-stone-700 to-zinc-900 flex-col justify-between p-12 text-white">
            <div class="z-10">
                <img class="h-12 mb-12 object-cover" alt="Invest hub logo" src="/src/assets/invest-hub-logo-alt.svg"
                    loading="lazy" />
                <h1 class="headline-font text-5xl font-extrabold leading-tight mb-6 text-balance">
                    Ayuda a <span class="text-primary-container">dar vida</span> a proyectos
                    creativos.
                </h1>

            </div>

            <!-- Elementos decorativo de fondo  -->
            <div class="absolute inset-0 overflow-hidden opacity-40">
                <div
                    class="absolute top-[-10%] right-[-10%] w-[80%] h-[80%] bg-linear-to-br from-primary/30 to-transparent rounded-full blur-[120px]">
                </div>
            </div>
        </section>
        <!-- Lado derecho -->
        <section class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-16 bg-surface-container-lowest">
            <div class="max-w-md mx-auto w-full">
                <div class="flex md:hidden items-center gap-2 mb-8">
                    <div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-sm"
                            data-icon="auto_awesome">auto_awesome</span>
                    </div>
                    <span class="headline-font font-bold text-xl tracking-tight text-on-surface">The Exchange</span>
                </div>
                <div class="mb-10">
                    <h2 class="headline-font text-3xl font-bold text-on-surface mb-2">Bienvenido de nuevo</h2>
                    <p class="text-on-surface-variant font-medium">Haz realidad un proyecto creativo</p>
                </div>
                <!-- Seccion del formulario -->
                <form class="space-y-6" id="login-form">
                    <div class="space-y-2">
                        <label class="text-xs font-bold tracking-wider text-on-surface-variant uppercase px-1">CORREO
                            ELECTRÓNICO</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
                                data-icon="mail">mail</span>
                            <input
                                class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent focus:border-primary/20 focus:ring-0 rounded-xl text-on-surface placeholder:text-outline/50 transition-all font-medium"
                                placeholder="nombre@ejemplo.com" type="email" id="login-email" />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center px-1">
                            <label
                                class="text-xs font-bold tracking-wider text-on-surface-variant uppercase">CONTRASEÑA</label>
                            <a class="text-xs font-bold text-primary hover:opacity-80 transition-opacity"
                                href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
                                data-icon="lock">lock</span>
                            <input
                                class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent focus:border-primary/20 focus:ring-0 rounded-xl text-on-surface placeholder:text-outline/50 transition-all font-medium"
                                placeholder="••••••••" type="password" id="login-password" />
                        </div>
                    </div>
                    <div class="flex items-center gap-3 px-1">
                        <input
                            class="w-5 h-5 rounded border-surface-container-high text-primary focus:ring-offset-0 focus:ring-0 bg-surface-container-low"
                            id="login-remember" type="checkbox" />
                        <label class="text-sm font-semibold text-on-surface-variant" for="remember">Mantener sesión
                            iniciada</label>
                    </div>
                    <button
                        class="w-full py-4 bg-primary-container text-on-primary-container headline-font font-bold text-lg rounded-full shadow-lg shadow-primary/10 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                        type="submit">Iniciar Sesión <span class="material-symbols-outlined"
                            data-icon="arrow_forward">arrow_forward</span></button>
                </form>
                <div class="mt-12 text-center">
                    <p class="text-on-surface-variant font-medium">
                        ¿No tienes cuenta aún?
                        <a class="text-primary font-bold hover:underline underline-offset-4 ml-1"
                            href="/src/pages/auth/register.html">
                            Registrate</a>
                    </p>
                </div>
            </div>
        </section>

    </div>

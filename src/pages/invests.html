<main class="flex-grow w-full max-w-screen-2xl mx-auto px-8 py-10 pt-28">
  <section class="mb-12">
    <div
      class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8"
    >
      <div>
        <h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-2">
          Proyectos de interés
        </h1>
        <p class="text-on-surface-variant text-lg">
          Tus proyectos guardados para seguirlos o contribuir más adelante.
        </p>
      </div>
      <a
        href="/projects"
        class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-bold flex items-center gap-2 hover:scale-105 active:scale-95 transition-all ambient-shadow"
      >
        <span class="material-symbols-outlined">add_circle</span>
        Explorar Proyectos
      </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-surface-container-lowest p-8 rounded-2xl ambient-shadow">
        <span
          class="text-sm font-bold text-primary uppercase tracking-widest mb-4 block"
          >Guardados</span
        >
        <p id="favorites-count" class="text-4xl font-extrabold text-on-surface">
          0
        </p>
      </div>
      <div class="bg-surface-container-lowest p-8 rounded-2xl ambient-shadow">
        <span
          class="text-sm font-bold text-tertiary-dim uppercase tracking-widest mb-4 block"
          >Con aportes</span
        >
        <p
          id="contributed-count"
          class="text-4xl font-extrabold text-on-surface"
        >
          0
        </p>
      </div>
      <div class="bg-inverse-surface p-8 rounded-2xl ambient-shadow">
        <span
          class="text-sm font-bold text-primary-fixed-dim uppercase tracking-widest mb-4 block"
          >Total simulado</span
        >
        <p id="contributed-total" class="text-4xl font-extrabold text-white">
          $0
        </p>
      </div>
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-on-surface">Lista de favoritos</h2>
    </div>
    <div id="favorite-projects-container" class="space-y-4"></div>
  </section>
</main>

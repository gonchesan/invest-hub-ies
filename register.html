<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">

    <meta name="description"
        content="InventHub existe para ayudar a hacer realidad proyectos creativos. Un lugar para el cine, la música, el arte, el teatro, los juegos, las historietas, el diseño, la fotografía y más.">

    <title>Invest Hub | Registro</title>

    <!-- Fuentes de  Google -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="/src/input.css" />
    <link href="./dist/output.css" rel="stylesheet">

</head>

<body
    class="min-h-screen flex items-center justify-center p-4 md:p-8 md:py-16 bg-[radial-gradient(circle_at_top_left,#f7f6fe_0%,#e0d7ff_100%)]">
    <main
        class="w-full max-w-6xl flex flex-col md:flex-row bg-surface-container-lowest rounded-xl overflow-hidden ambient-shadow min-h-175">
        <a href="/index.html" class="flex gap-2 absolute top-6 text-primary font-bold ml-1">
            <span class="material-symbols-outlined" data-icon="arrow_left_alt">arrow_left_alt</span>
            Volver
        </a>
        <!-- Lado izquierdo -->
        <section
            class="hidden md:flex md:w-1/2 relative bg-linear-60 from-zinc-800 via-stone-700 to-zinc-900 flex-col justify-between p-12 text-white">
            <div class="z-10 relative">
                <img class="h-12 mb-12 object-cover" alt="Invest hub logo" src="./src/assets/invest-hub-logo-alt.svg"
                    loading="lazy" />

                <h1 class="headline-font text-5xl font-extrabold leading-tight mb-6">
                    Inversión visionaria para el <span class="text-primary-container">impacto global</span>.
                </h1>

            </div>

            <!-- Elementos decorativo de fondo  -->
            <div class="absolute inset-0 overflow-hidden opacity-40">
                <div
                    class="absolute top-[-10%] right-[-10%] w-[80%] h-[80%] bg-linear-to-br from-primary/30 to-transparent rounded-full blur-[120px]">
                </div>
            </div>
        </section>
        <!-- Lado derecho -->
        <section class="w-full lg:w-1/2 flex flex-col items-center justify-center p-6 bg-surface">
            <div class="w-full max-w-md">
                <div class="lg:hidden mb-12">
                    <h1 class="font-headline font-extrabold text-inverse-surface text-2xl tracking-tight">The Curated
                        Exchange</h1>
                </div>
                <div class="mb-10">
                    <h2 class="font-headline text-4xl font-extrabold text-on-background mb-3 tracking-tight">Crea tu
                        cuenta</h2>
                    <p class="text-on-surface-variant font-medium">Comienza tu viaje en la inversión estratégica hoy
                        mismo.</p>
                </div>
                <!-- Seccion del formulario -->
                <form class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label
                                class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1">Nombre</label>
                            <input
                                class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline/50 font-medium"
                                placeholder="Ej. Ana" type="text" />
                        </div>
                        <div class="space-y-2">
                            <label
                                class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1">Apellido</label>
                            <input
                                class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline/50 font-medium"
                                placeholder="Ej. García" type="text" />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label
                            class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1">Correo
                            electrónico</label>
                        <input
                            class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline/50 font-medium"
                            placeholder="nombre@ejemplo.com" type="email" />
                    </div>
                    <div class="space-y-2">
                        <label
                            class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1">Fecha
                            de nacimiento</label>
                        <div class="relative">
                            <input
                                class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all text-on-surface-variant font-medium"
                                type="date" />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label
                            class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1">Contraseña</label>
                        <div class="relative">
                            <input
                                class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline/50 font-medium"
                                placeholder="••••••••" type="password" />
                            <button
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"
                                type="button">
                                <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                            </button>
                        </div>
                        <p class="text-[10px] text-on-surface-variant/60 px-1 italic">Mínimo 8 caracteres, incluyendo un
                            número y un símbolo.</p>
                    </div>
                    <div class="pt-4">
                        <button
                            class="w-full bg-primary-container hover:bg-primary-fixed-dim text-on-primary-container font-headline font-bold py-5 rounded-full ambient-shadow transition-all active:scale-95 flex items-center justify-center gap-3"
                            type="submit">
                            Registrarme ahora
                            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
                        </button>
                    </div>


                </form>
                <div class="mt-12 text-center">
                    <p class="text-on-surface-variant font-medium">
                        ¿Ya eres miembro?
                        <a class="text-primary font-bold hover:underline underline-offset-4 ml-1"
                            href="/login.html">Iniciar
                            Sesión</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
